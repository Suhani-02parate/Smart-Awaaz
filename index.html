<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Awaaz — NMC Civic Issue Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --ink:#152238;
    --ink-soft:#5C6B80;
    --civic-blue:#0B4C8C;
    --civic-blue-2:#1470B8;
    --saffron:#FF7A1A;
    --saffron-deep:#F2600A;
    --saffron-ink:#B7440A;
    --terracotta:#C0392B;
    --moss:#2E8B57;
    --line:#E4EAF0;
    --paper-shadow: 0 1px 0 rgba(11,76,140,0.05);
    --radius: 3px;
    --orange-tint:#FFF3EA;
    --blue-tint:#EAF3FC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 100% 0%, rgba(255,122,26,0.07), transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(11,76,140,0.06), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background:var(--saffron); color:#fff; }

  /* ---------- View transition ---------- */
  main{ animation: viewFade .38s ease; }
  @keyframes viewFade{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  :focus-visible{ outline:2px solid var(--civic-blue); outline-offset:2px; }

  /* ---------- App shell ---------- */
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  header.topbar{
    background:linear-gradient(120deg, var(--civic-blue) 0%, var(--civic-blue-2) 100%);
    color:#F5F8FC;
    padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:4px solid var(--saffron);
    position:sticky; top:0; z-index:50;
  }
  .brand{ display:flex; align-items:center; gap:10px; transition:transform .15s ease; }
  .brand:hover{ transform:translateX(2px); }
  .brand-mark{
    width:34px; height:34px; border-radius:50%;
    background:var(--saffron);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; color:#fff;
    font-size:16px;
    box-shadow:0 0 0 3px rgba(255,255,255,0.18);
  }
  .brand-text{ line-height:1.1; }
  .brand-text .name{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; }
  .brand-text .tag{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; opacity:.8; }
  .topbar-right{ display:flex; align-items:center; gap:14px; font-size:13px; }
  .topbar-right .who{ opacity:.9; }
  .btn-ghost-top{
    background:transparent; border:1px solid rgba(245,248,252,.4); color:#F5F8FC;
    padding:7px 14px; border-radius:var(--radius); font-size:13px;
    transition:background .15s ease, transform .12s ease;
  }
  .btn-ghost-top:hover{ background:rgba(245,248,252,.14); transform:translateY(-1px); }

  /* ---------- Header photo (Modi ji cutout) ---------- */
  header.topbar{ padding-right:210px; }
  .header-photo{
    position:absolute; right:22px; top:-4px;
    height:132px; z-index:2;
    filter:drop-shadow(0 8px 14px rgba(11,76,140,.35));
    pointer-events:none;
    animation:photoRise .5s ease;
  }
  @keyframes photoRise{ from{ opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  header.topbar{ position:sticky; overflow:visible; }
  @media (max-width:860px){ .header-photo{ display:none; } header.topbar{ padding-right:24px; } }

  main{ flex:1; }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:12px 22px; border-radius:var(--radius); border:none;
    font-size:14px; font-weight:600; letter-spacing:.01em;
    transition:transform .12s ease, background .15s ease;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--saffron); color:var(--civic-blue); }
  .btn-primary:hover{ background:#D68C22; }
  .btn-outline{ background:transparent; border:1.5px solid var(--civic-blue); color:var(--civic-blue); }
  .btn-outline:hover{ background:rgba(22,59,77,0.06); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 14px; font-size:12.5px; }

  /* ---------- Landing ---------- */
  .hero{
    padding:64px 24px 40px;
    max-width:1080px; margin:0 auto;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--civic-blue-2); display:flex; align-items:center; gap:10px; margin-bottom:18px;
  }
  .eyebrow::before{ content:''; width:26px; height:1px; background:var(--civic-blue-2); }
  .hero h1{ font-size:clamp(34px,5vw,54px); line-height:1.05; max-width:14ch; color:var(--civic-blue); }
  .hero p.lede{ margin-top:18px; max-width:56ch; font-size:16.5px; line-height:1.6; color:var(--ink-soft); }

  .portal-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:20px;
    margin-top:44px; max-width:1080px; padding:0 24px 64px; margin-left:auto; margin-right:auto;
  }
  @media (max-width:720px){ .portal-grid{ grid-template-columns:1fr; } }

  .portal-card{
    background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:28px; position:relative; overflow:hidden;
    box-shadow: var(--paper-shadow);
  }
  .portal-card::before{
    content:''; position:absolute; top:0; left:0; width:4px; height:100%;
    background:var(--civic-blue);
  }
  .portal-card.nmc::before{ background:var(--saffron); }
  .portal-card .num{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); }
  .portal-card h2{ font-size:24px; margin-top:8px; color:var(--civic-blue); }
  .portal-card p{ color:var(--ink-soft); font-size:14px; line-height:1.55; margin-top:8px; margin-bottom:22px; }

  .strip{
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:22px 24px; display:flex; gap:40px; flex-wrap:wrap; justify-content:center;
    max-width:1080px; margin:0 auto; font-size:13px; color:var(--ink-soft);
  }
  .strip b{ color:var(--civic-blue); font-family:'IBM Plex Mono',monospace; font-size:18px; display:block; }

  /* ---------- Auth forms ---------- */
  .auth-wrap{
    max-width:440px; margin:56px auto; padding:0 24px 40px;
  }
  .auth-card{
    background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:32px;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--civic-blue-2);
    margin-bottom:22px; text-decoration:none; font-weight:500;
  }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--civic-blue); margin-bottom:6px; letter-spacing:.02em; }
  .field .hint{ font-size:11.5px; color:var(--ink-soft); margin-top:5px; }
  .field input, .field select, .field textarea{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:var(--radius);
    font-family:inherit; font-size:14.5px; color:var(--ink); background:#FCFBF8;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--civic-blue-2); background:#fff; }
  .field textarea{ resize:vertical; min-height:90px; }
  .err{ color:var(--terracotta); font-size:12.5px; margin-top:6px; display:none; }
  .field.invalid input, .field.invalid select{ border-color:var(--terracotta); }
  .field.invalid .err{ display:block; }
  .demo-note{ font-size:12px; color:var(--ink-soft); background:#F4F2EC; border:1px dashed var(--line); padding:10px 12px; border-radius:var(--radius); margin-top:16px; }

  /* ---------- Dashboard ---------- */
  .dash-wrap{ max-width:1080px; margin:0 auto; padding:36px 24px 60px; }
  .dash-head{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; margin-bottom:8px; }
  .dash-head h1{ font-size:28px; color:var(--civic-blue); }
  .dash-head .sub{ color:var(--ink-soft); font-size:14px; margin-top:4px; }

  .section-label{
    font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.1em;
    color:var(--civic-blue-2); margin:38px 0 16px; display:flex; align-items:center; gap:10px;
  }
  .section-label::after{ content:''; flex:1; height:1px; background:var(--line); }

  .cat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  @media (max-width:820px){ .cat-grid{ grid-template-columns:repeat(2,1fr); } }
  .cat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:22px 18px;
    text-align:left; transition:border-color .15s ease, transform .12s ease;
  }
  .cat-card:hover{ border-color:var(--civic-blue-2); transform:translateY(-2px); }
  .cat-icon{ font-size:26px; margin-bottom:14px; display:block; }
  .cat-card .cname{ font-weight:600; font-size:15px; color:var(--civic-blue); }
  .cat-card .cdesc{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.5; }

  /* Docket cards (signature element) */
  .docket{
    position:relative; background:var(--surface); border:1px solid var(--line);
    padding:18px 20px 18px 22px; margin-bottom:14px; border-radius:2px;
    background-image: radial-gradient(circle at 0 50%, var(--bg) 6px, transparent 6.5px);
    background-position: left center; background-repeat:no-repeat;
  }
  .docket::after{
    content:''; position:absolute; right:0; top:50%; transform:translateY(-50%);
    width:12px; height:12px; border-radius:50%; background:var(--bg);
    box-shadow: -1000px 0 0 -994px transparent;
  }
  .docket-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .docket-id{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); }
  .docket h3{ font-size:16px; margin-top:4px; color:var(--ink); }
  .docket .meta{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; }
  .docket .desc{ font-size:13.5px; color:var(--ink); margin-top:10px; line-height:1.55; max-width:60ch; }
  .docket .thumb{ width:64px; height:64px; object-fit:cover; border-radius:3px; border:1px solid var(--line); }

  .stamp{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; padding:6px 12px; border-radius:20px; border:1.5px dashed;
    transform:rotate(-3deg); white-space:nowrap;
  }
  .stamp.pending{ color:var(--terracotta); border-color:var(--terracotta); }
  .stamp.progress{ color:var(--saffron-ink); border-color:var(--saffron); }
  .stamp.resolved{ color:var(--moss); border-color:var(--moss); }

  .sev-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    padding:4px 9px; border-radius:3px; margin-top:8px;
  }
  .sev-high{ background:#F7E4DC; color:var(--terracotta); }
  .sev-medium{ background:#FBF0DA; color:var(--saffron-ink); }
  .sev-low{ background:#E3EDE6; color:var(--moss); }
  .sev-badge .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .empty{
    border:1px dashed var(--line); border-radius:6px; padding:32px; text-align:center;
    color:var(--ink-soft); font-size:14px;
  }

  /* ---------- Report form ---------- */
  .report-wrap{ max-width:640px; margin:0 auto; padding:36px 24px 60px; }
  .chosen-cat{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:6px; padding:16px 18px; margin-bottom:26px;
  }
  .chosen-cat .cat-icon{ font-size:24px; margin:0; }
  .chosen-cat .cname{ font-weight:600; color:var(--civic-blue); }

  .ai-box{
    border:1.5px solid var(--civic-blue-2); background:#F3F7F8; border-radius:6px; padding:16px 18px; margin-top:6px;
  }
  .ai-box .ai-title{ font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--civic-blue-2); display:flex; align-items:center; gap:8px; }
  .ai-box .ai-title .pulse{ width:7px; height:7px; border-radius:50%; background:var(--civic-blue-2); animation:pulse 1.2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .ai-result{ margin-top:10px; font-size:13.5px; line-height:1.6; }

  /* ---------- NMC dashboard ---------- */
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:8px; }
  @media (max-width:720px){ .stat-row{ grid-template-columns:repeat(2,1fr); } }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:16px 18px; }
  .stat .n{ font-family:'IBM Plex Mono',monospace; font-size:26px; color:var(--civic-blue); }
  .stat .l{ font-size:12px; color:var(--ink-soft); margin-top:4px; }

  .filter-row{ display:flex; gap:10px; flex-wrap:wrap; margin:20px 0; }
  .chip{
    font-size:12.5px; padding:7px 14px; border-radius:20px; border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink-soft); font-weight:500;
  }
  .chip.active{ border-color:var(--civic-blue); color:var(--civic-blue); background:#EAF1F3; }

  .status-select{
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:6px 10px; border-radius:var(--radius);
    border:1.5px solid var(--line); background:#FCFBF8;
  }

  footer{ text-align:center; padding:22px; font-size:12px; color:var(--ink-soft); border-top:1px solid var(--line); background:var(--blue-tint); }

  /* ---------- Interactive extras ---------- */
  .btn{ position:relative; overflow:hidden; }
  .ripple{
    position:absolute; border-radius:50%; transform:scale(0);
    background:rgba(255,255,255,.55); animation:rippleAnim .55s ease-out forwards;
    pointer-events:none;
  }
  @keyframes rippleAnim{ to{ transform:scale(2.6); opacity:0; } }

  .strip b{ transition:color .2s ease; }

  .toast-wrap{
    position:fixed; top:88px; right:16px; z-index:999; display:flex; flex-direction:column; gap:10px;
  }
  .toast{
    background:var(--civic-blue); color:#fff; padding:12px 18px; border-radius:6px; font-size:13px;
    box-shadow:0 6px 18px rgba(11,76,140,.28); border-left:4px solid var(--saffron);
    animation:toastIn .25s ease, toastOut .3s ease 2.7s forwards;
    max-width:320px;
  }
  @keyframes toastIn{ from{ opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);} }
  @keyframes toastOut{ to{ opacity:0; transform:translateX(30px);} }

  .search-row{ margin:18px 0; }
  .search-row input{
    width:100%; padding:11px 14px; border:1.5px solid var(--line); border-radius:var(--radius);
    font-family:inherit; font-size:14px; background:#fff;
  }
  .search-row input:focus{ border-color:var(--civic-blue-2); }

  .orange-divider{
    height:4px; max-width:1080px; margin:0 auto;
    background:repeating-linear-gradient(90deg, var(--saffron) 0 22px, var(--civic-blue) 22px 44px, #fff 44px 50px);
    opacity:.85;
  }

  .cat-card, .portal-card, .stat, .docket{ transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease; }
  .portal-card:hover{ transform:translateY(-3px); box-shadow:0 10px 24px rgba(11,76,140,.10); border-color:var(--civic-blue-2); }
  .stat:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(255,122,26,.12); border-color:var(--saffron); }
  .docket:hover{ box-shadow:0 6px 16px rgba(11,76,140,.08); }

  .chip{ transition:transform .12s ease; }
  .chip:active{ transform:scale(.95); }

  /* ---------- Clickable photo evidence + lightbox ---------- */
  .docket .thumb-btn{
    border:none; padding:0; background:none; cursor:zoom-in; display:block;
    border-radius:3px; overflow:hidden; width:64px; height:64px; flex:none;
  }
  .docket .thumb-btn img{ width:64px; height:64px; object-fit:cover; display:block; transition:transform .2s ease; }
  .docket .thumb-btn:hover img{ transform:scale(1.06); }
  .docket .area-tag{
    display:inline-block; font-size:11px; font-weight:600; color:var(--civic-blue-2);
    background:var(--blue-tint); padding:3px 8px; border-radius:3px; margin-top:6px; margin-right:6px;
  }

  .lightbox{
    position:fixed; inset:0; background:rgba(10,18,28,.86); z-index:300;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s ease; padding:24px;
  }
  .lightbox.open{ opacity:1; pointer-events:auto; }
  .lightbox-inner{ position:relative; max-width:min(94vw,980px); max-height:92vh; text-align:center; }
  .lightbox-media{ position:relative; display:inline-block; max-width:100%; }
  .lightbox-img{ max-width:100%; max-height:76vh; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,.5); display:block; margin:0 auto; }

  /* Side-by-side RGB + Depth heatmap comparison (shown after "Generate heatmap") */
  .lightbox-compare{
    display:none; gap:16px; align-items:flex-start; justify-content:center; flex-wrap:wrap;
  }
  .lightbox-compare.show{ display:flex; }
  .lightbox-media.hide{ display:none; }
  .lightbox-panel{ flex:1 1 260px; max-width:440px; }
  .lightbox-panel img, .lightbox-panel canvas{
    width:100%; height:auto; max-height:58vh; object-fit:contain; border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.5); display:block; background:#0c1230;
  }
  .lightbox-panel-label{
    color:#CFE0EF; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; margin-top:8px;
  }
  .lightbox-cap{ color:#F5F8FC; font-size:13px; margin-top:12px; }
  .lightbox-authenticity{color:#fff;font-size:14px;font-weight:700;margin-top:12px;}
  .lightbox-authenticity small{display:block;font-size:11px;font-weight:400;color:#CFE0EF;margin-top:3px;}
  .lightbox-controls{ display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .lightbox-controls .btn{ padding:9px 16px; font-size:12.5px; }
  .lightbox-heat-legend{
    display:none; align-items:center; justify-content:center; gap:14px; margin-top:10px;
    font-size:11px; color:#CFE0EF; flex-wrap:wrap;
  }
  .lightbox-heat-legend.show{ display:flex; }
  .lightbox-heat-legend .sw{ display:inline-flex; align-items:center; gap:5px; }
  .lightbox-heat-legend .sw i{ width:11px; height:11px; border-radius:50%; display:inline-block; }

  .lightbox-detect-legend{
    display:none; align-items:center; justify-content:center; gap:14px; margin-top:10px;
    font-size:11px; color:#CFE0EF; flex-wrap:wrap;
  }
  .lightbox-detect-legend.show{ display:flex; }
  .lightbox-detect-legend .sw{ display:inline-flex; align-items:center; gap:5px; }
  .lightbox-detect-legend .sw i{ width:11px; height:11px; display:inline-block; }
  .lightbox-detect-legend .detect-model-tag{
    font-size:10.5px; color:#8FA6C2; letter-spacing:.02em;
  }
  .lightbox-detect-btn{ display:none; }
  .lightbox-detect-btn.show{ display:inline-flex; }
  .lightbox-close{
    position:absolute; top:-16px; right:-16px; width:34px; height:34px; border-radius:50%;
    background:var(--saffron); color:#fff; border:2px solid #fff; font-size:16px; line-height:1;
    cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.3);
  }

  /* ---------- Heatmap view ---------- */
  .heatmap-wrap{ max-width:1080px; margin:0 auto; padding:36px 24px 60px; }
  .heatmap-toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 22px; }
  .heatmap-stage{
    position:relative; width:100%; aspect-ratio:4/3; max-height:520px;
    background:
      linear-gradient(180deg, var(--blue-tint), #fff 60%);
    border:1px solid var(--line); border-radius:8px; overflow:hidden;
  }
  .heatmap-stage svg{ width:100%; height:100%; display:block; }
  .heatmap-legend{
    display:flex; align-items:center; gap:14px; font-size:11.5px; color:var(--ink-soft);
    margin-top:12px; flex-wrap:wrap;
  }
  .heatmap-legend .sw{ display:inline-flex; align-items:center; gap:6px; }
  .heatmap-legend .sw i{ width:12px; height:12px; border-radius:3px; display:inline-block; }
  .heatmap-note{
    font-size:12px; color:var(--ink-soft); font-style:italic; margin-top:8px;
  }

  /* ---------- Priority list ---------- */
  .priority-list{ display:flex; flex-direction:column; gap:10px; }
  .priority-row{
    display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line);

<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ---------------- State ---------------- */
  const state = {
    view: 'verificationChoice',
    currentUser: null,        // {type:'citizen'|'nmc', name, age, phone}
    citizenVerification: null, // {method:'digilocker'|'manual', verified:true, ...}
    reportCategory: null,     // category being reported
    issues: [],               // shared in-memory store
    filter: { status: 'all', category: 'all', query: '' },
    heatmapCategory: 'pothole',
    ticketSeq: 4820
  };

  const CATEGORIES = [
    { id:'pothole', label:'Pothole (खड्डा)', icon:'🕳️', desc:'Damaged or crater-like road surface' },
    { id:'streetlight', label:'Broken Street Light (तुटलेला पथदिवा)', icon:'💡', desc:'Non-functional or damaged street lighting' },
    { id:'garbage', label:'Illegal Garbage Dumping (बेकायदेशीर कचरा टाकणे)', icon:'🗑️', desc:'Unauthorised waste dumping in public space' },
    { id:'parking', label:'Illegal Parking (बेकायदेशीर पार्किंग)', icon:'🚫', desc:'Vehicles parked in no-parking zones or blocking traffic' },
  ];

  function catInfo(id){ return CATEGORIES.find(c=>c.id===id) || CATEGORIES[0]; }

  // Approximate, illustrative positions (percent of stage width/height) for Nagpur-area
  // wards/localities — used to place reports on the heatmap. Not to exact map scale.
  const AREAS = [
    { id:'sitabuldi',    label:'Sitabuldi',         x:50, y:48 },
    { id:'dharampeth',   label:'Dharampeth',        x:37, y:54 },
    { id:'sadar',        label:'Sadar',             x:46, y:33 },
    { id:'civillines',   label:'Civil Lines',       x:56, y:38 },
    { id:'mahal',        label:'Mahal',             x:61, y:50 },
    { id:'ambazari',     label:'Ambazari',          x:22, y:58 },
    { id:'pratapnagar',  label:'Pratap Nagar',      x:34, y:70 },
    { id:'manishnagar',  label:'Manish Nagar',      x:19, y:76 },
    { id:'nandanvan',    label:'Nandanvan',         x:70, y:63 },
    { id:'kamptee',      label:'Kamptee Road',      x:78, y:20 },
  ];
  function areaInfo(id){ return AREAS.find(a=>a.id===id) || null; }

  /* ---------------- Helpers ---------------- */
  function el(html){
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function nextTicket(){
    state.ticketSeq += 1;
    return 'NMC-2026-' + state.ticketSeq;
  }
  function fmtDate(d){
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }) + ' · ' +
           d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  /* ---------------- Toasts ---------------- */
  function ensureToastWrap(){
    let w = document.querySelector('.toast-wrap');
    if (!w){ w = el(`<div class="toast-wrap"></div>`); document.body.appendChild(w); }
    return w;
  }
  function showToast(msg){
    const w = ensureToastWrap();
    const t = el(`<div class="toast">${escapeHtml(msg)}</div>`);
    w.appendChild(t);
    setTimeout(()=>{ t.remove(); }, 3000);
  }

  /* ---------------- Lightbox (click-to-enlarge photo evidence + on-photo heatmap) ---------------- */
  function ensureLightbox(){
    let lb = document.querySelector('.lightbox');
    if (!lb){
      lb = el(`
        <div class="lightbox">
          <div class="lightbox-inner">
            <button type="button" class="lightbox-close" aria-label="Close">✕</button>
            <div class="lightbox-media">
              <img class="lightbox-img" src="" alt="Photo evidence, enlarged">
            </div>
            <div class="lightbox-compare">
              <div class="lightbox-panel">
                <img class="lightbox-rgb-img" src="" alt="RGB photo evidence">
                <div class="lightbox-panel-label">RGB image</div>
              </div>
              <div class="lightbox-panel">
                <canvas class="lightbox-canvas"></canvas>
                <div class="lightbox-panel-label">Depth heatmap</div>
              </div>
            </div>
            <div class="lightbox-controls">
              <button type="button" class="btn btn-outline lightbox-heat-btn">🔥 Generate heatmap on this photo</button>
              <button type="button" class="btn btn-outline lightbox-detect-btn">🎯 Detect potholes (AI)</button>
            </div>
            <div class="lightbox-heat-legend">
              <span class="sw"><i style="background:#313695;"></i> Road surface</span>
              <span class="sw"><i style="background:#66bd63;"></i> Shallow</span>
              <span class="sw"><i style="background:#fee08b;"></i> Moderate depth</span>
              <span class="sw"><i style="background:#a50026;"></i> Deepest point</span>
            </div>
            <div class="lightbox-detect-legend">
              <span class="sw"><i style="background:#39FF88;border-radius:2px;"></i> Bounding box</span>
              <span class="sw"><i style="background:rgba(57,255,136,0.5);border-radius:2px;"></i> Segmentation mask</span>
              <span class="detect-model-tag mono">Mask R-CNN–style instance segmentation · simulated on-device, no live model call</span>
            </div>
            <div class="lightbox-authenticity" aria-live="polite"></div>
            <div class="lightbox-cap"></div>
          </div>
        </div>
      `);
      document.body.appendChild(lb);
      lb.addEventListener('click', (e)=>{ if (e.target === lb) closeLightbox(); });
      lb.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
      lb.querySelector('.lightbox-heat-btn').addEventListener('click', ()=> setLightboxMode('heatmap'));
      lb.querySelector('.lightbox-detect-btn').addEventListener('click', ()=> setLightboxMode('detect'));
      document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeLightbox(); });
    }
    return lb;
  }

  let lightboxIssue = null;
  let lightboxMode = 'none'; // 'none' | 'heatmap' | 'detect'

  function openLightbox(issue, caption){
    const lb = ensureLightbox();
    lightboxIssue = issue;
    lightboxMode = 'none';
    const img = lb.querySelector('.lightbox-img');
    const media = lb.querySelector('.lightbox-media');
    const compare = lb.querySelector('.lightbox-compare');
    img.src = issue.photo;
    media.classList.remove('hide');
    compare.classList.remove('show');
    lb.querySelector('.lightbox-cap').textContent = caption || '';
    const authenticity = lb.querySelector('.lightbox-authenticity');
    if (state.currentUser && state.currentUser.type === 'nmc' && issue.photo) {
      authenticity.innerHTML = (Number(issue.id.split('-').pop()) % 3 === 0 ? 'AI-Generated Image' : 'Real Image') + '<small>(Illustrative demo — not AI verified)</small>';
    } else { authenticity.textContent = ''; }
    lb.querySelector('.lightbox-heat-legend').classList.remove('show');
    lb.querySelector('.lightbox-detect-legend').classList.remove('show');
    const heatBtn = lb.querySelector('.lightbox-heat-btn');
    heatBtn.textContent = '🔥 Generate heatmap on this photo';
    heatBtn.disabled = false;
    const detectBtn = lb.querySelector('.lightbox-detect-btn');
    detectBtn.textContent = '🎯 Detect potholes (AI)';
    detectBtn.disabled = false;
    // Pothole detection only makes sense for the pothole category — the demo
    // model referenced (Mask R-CNN pothole detector) is trained for that class only.
    detectBtn.classList.toggle('show', issue.category === 'pothole');
    lb.classList.add('open');
  }
  function closeLightbox(){
    const lb = document.querySelector('.lightbox');
    if (lb) lb.classList.remove('open');
    lightboxIssue = null;
  }

  // Deterministic pseudo-random generator, seeded by docket id, so the same
  // photo always produces the same heatmap rather than a new one every click.
  function seededRandom(seedStr){
    let h = 0;
    for (let i=0;i<seedStr.length;i++){ h = (h*31 + seedStr.charCodeAt(i)) | 0; }
    return function(){
      h = (h*1103515245 + 12345) & 0x7fffffff;
      return (h % 10000) / 10000;
    };
  }

  // Jet/"turbo"-style depth colour ramp: near/background = deep blue,
  // pothole rim = green→yellow, pothole floor (deepest) = orange→dark red.
  // t is 0 (background / shallow) .. 1 (deepest point).
  const DEPTH_RAMP = [
    { t:0.00, c:[48, 54, 149]  },  // deep blue — road surface / background
    { t:0.20, c:[69, 117, 180] },
    { t:0.38, c:[102, 189, 99] },  // green — shallow rim
    { t:0.55, c:[254, 224, 139] }, // yellow — moderate depth
    { t:0.72, c:[253, 141, 60]  }, // orange
    { t:0.87, c:[215, 25, 28]  },  // red
    { t:1.00, c:[130, 5, 10]   }   // dark maroon — deepest point
  ];
  function depthColor(t){
    t = Math.max(0, Math.min(1, t));
    for (let i=0;i<DEPTH_RAMP.length-1;i++){
      const a = DEPTH_RAMP[i], b = DEPTH_RAMP[i+1];
      if (t >= a.t && t <= b.t){
        const f = (t - a.t) / (b.t - a.t || 1);
        const r = Math.round(a.c[0] + (b.c[0]-a.c[0])*f);
        const g = Math.round(a.c[1] + (b.c[1]-a.c[1])*f);
        const bl = Math.round(a.c[2] + (b.c[2]-a.c[2])*f);
        return `rgb(${r},${g},${bl})`;
      }
    }
    const last = DEPTH_RAMP[DEPTH_RAMP.length-1].c;
    return `rgb(${last[0]},${last[1]},${last[2]})`;
  }

  function paintHeatmapOnCanvas(canvas, img, issue){
    const w = img.naturalWidth || img.width || 400;
    const h = img.naturalHeight || img.height || 300;
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');

    // Flat "background" depth colour (road surface, far from any pothole)
    ctx.fillStyle = depthColor(0);
    ctx.fillRect(0, 0, w, h);

    const sev = issue.severity || 'Medium';
    const sevWeight = sev === 'High' ? 1 : sev === 'Medium' ? 0.78 : 0.55;
    const blobCount = sev === 'High' ? 2 : 1;
    const rand = seededRandom((issue.id || 'issue') + '-depth-' + sev);

    ctx.globalCompositeOperation = 'lighten';
    for (let i = 0; i < blobCount; i++){
      const cx = w * (0.34 + rand() * 0.34);
      const cy = h * (0.32 + rand() * 0.36);
      const radius = Math.min(w, h) * (0.2 + rand() * 0.14) * (i === 0 ? 1 : 0.62);
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      // Sample the depth ramp densely so the blob reads like a real jet-colormap
      // depth image, with the hottest (deepest) colour concentrated at the centre.
      const stops = 10;
      for (let s = 0; s <= stops; s++){
        const frac = s / stops;              // 0 = centre, 1 = edge
        const depthT = sevWeight * (1 - frac); // deepest at centre, fading outward
        grad.addColorStop(frac, depthColor(depthT));
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // Deterministic "confidence score" for a simulated detection box — reads
  // higher for High-severity dockets, same seeded-random approach as the
  // depth heatmap, so a given photo always reports the same score.
  function detectionConfidence(rand, sev){
    const base = sev === 'High' ? 0.90 : sev === 'Medium' ? 0.78 : 0.62;
    const span = sev === 'High' ? 0.09 : sev === 'Medium' ? 0.12 : 0.16;
    return Math.min(0.99, base + rand() * span);
  }

  // Draws simulated Mask R-CNN–style output: the source photo with, for each
  // detected pothole, a bounding box, a translucent instance-segmentation
  // mask, and a class+confidence label — in the visual style of the
  // NyanSwanAung/Pothole-Detection-using-MaskRCNN reference project.
  // This is a client-side illustrative simulation (seeded per docket id, so
  // it's stable across views) — there's no model actually running inference
  // here, matching how the "depth heatmap" panel next to it is simulated too.
  function paintPotholeDetection(canvas, img, issue){
    const w = img.naturalWidth || img.width || 400;
    const h = img.naturalHeight || img.height || 300;
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);

    const sev = issue.severity || 'Medium';
    const boxCount = sev === 'High' ? 2 : 1;
    const rand = seededRandom((issue.id || 'issue') + '-mrcnn-' + sev);
    const maskColor = '57,255,136'; // lime-green, classic instance-seg overlay colour

    for (let i = 0; i < boxCount; i++){
      const cx = w * (0.32 + rand() * 0.36);
      const cy = h * (0.30 + rand() * 0.38) * (i === 0 ? 1 : 1.0) + (i === 1 ? h * 0.06 : 0);
      const rx = Math.min(w, h) * (0.14 + rand() * 0.09) * (i === 0 ? 1 : 0.7);
      const ry = rx * (0.62 + rand() * 0.18);
      const conf = detectionConfidence(rand, sev);

      // Irregular polygon mask around an ellipse, so it reads as a segmentation
      // mask rather than a perfect circle.
      const points = 14;
      ctx.beginPath();
      for (let p = 0; p <= points; p++){
        const ang = (p / points) * Math.PI * 2;
        const wobble = 0.82 + rand() * 0.36;
        const px = cx + Math.cos(ang) * rx * wobble;
        const py = cy + Math.sin(ang) * ry * wobble;
        if (p === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = `rgba(${maskColor},0.38)`;
      ctx.fill();
      ctx.lineWidth = Math.max(1.5, w * 0.003);
      ctx.strokeStyle = `rgba(${maskColor},0.9)`;
      ctx.stroke();

      // Bounding box around the mask, with margin — the classic detector overlay.
      const pad = rx * 0.28;
      const bx = cx - rx - pad, by = cy - ry - pad;
      const bw = (rx + pad) * 2, bh = (ry + pad) * 2;
      ctx.strokeStyle = `rgb(${maskColor})`;
      ctx.lineWidth = Math.max(2, w * 0.004);
      ctx.strokeRect(bx, by, bw, bh);

      // Label chip: "pothole 0.93"
      const label = `pothole ${conf.toFixed(2)}`;
      ctx.font = `700 ${Math.max(12, Math.round(w * 0.028))}px 'IBM Plex Mono', monospace`;
      const tw = ctx.measureText(label).width;
      const padX = w * 0.01, labelH = Math.max(16, w * 0.032);
      const ly = Math.max(0, by - labelH);
      ctx.fillStyle = `rgb(${maskColor})`;
      ctx.fillRect(bx, ly, tw + padX * 2, labelH);
      ctx.fillStyle = '#062012';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, bx + padX, ly + labelH / 2 + 1);
    }
  }

  function setLightboxMode(mode){
    const lb = document.querySelector('.lightbox');
    if (!lb || !lightboxIssue) return;
    const img = lb.querySelector('.lightbox-img');
    const media = lb.querySelector('.lightbox-media');
    const compare = lb.querySelector('.lightbox-compare');
    const rgbImg = lb.querySelector('.lightbox-rgb-img');
    const canvas = lb.querySelector('.lightbox-canvas');
    const panelLabel = lb.querySelector('.lightbox-panel:last-child .lightbox-panel-label');
    const heatLegend = lb.querySelector('.lightbox-heat-legend');
    const detectLegend = lb.querySelector('.lightbox-detect-legend');
    const heatBtn = lb.querySelector('.lightbox-heat-btn');
    const detectBtn = lb.querySelector('.lightbox-detect-btn');

    // Clicking the active mode's button again toggles back to the plain photo.
    const nextMode = (lightboxMode === mode) ? 'none' : mode;
    lightboxMode = nextMode;

    heatLegend.classList.remove('show');
    detectLegend.classList.remove('show');
    heatBtn.textContent = '🔥 Generate heatmap on this photo';
    detectBtn.textContent = '🎯 Detect potholes (AI)';

    if (nextMode === 'none'){
      compare.classList.remove('show');
      media.classList.remove('hide');
      return;
    }

    const finish = ()=>{
      rgbImg.src = img.src;
      if (nextMode === 'heatmap'){
        paintHeatmapOnCanvas(canvas, img, lightboxIssue);
        panelLabel.textContent = 'Depth heatmap';
        heatLegend.classList.add('show');
        heatBtn.textContent = '↺ Show original photo';
      } else {
        paintPotholeDetection(canvas, img, lightboxIssue);
        panelLabel.textContent = 'AI pothole detection';
        detectLegend.classList.add('show');
        detectBtn.textContent = '↺ Show original photo';
      }
      media.classList.add('hide');
      compare.classList.add('show');
    };
    if (img.complete && img.naturalWidth) finish();
    else img.addEventListener('load', finish, { once:true });
  }

  /* ---------------- Ripple + count-up ---------------- */
  document.addEventListener('click', (e)=>{
    const btn = e.target.closest('.btn');
    if (!btn) return;
    const rect = btn.getBoundingClientRect();
    const r = el(`<span class="ripple"></span>`);
    const size = Math.max(rect.width, rect.height);
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX - rect.left - size/2) + 'px';
    r.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(r);
    setTimeout(()=> r.remove(), 600);
  });

  function animateCount(node, target, duration){
    duration = duration || 700;
    const start = performance.now();
    function step(now){
      const p = Math.min(1, (now - start) / duration);
      const val = Math.round(target * (1 - Math.pow(1 - p, 3)));
      node.textContent = val;
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* ---------------- AI severity classification ---------------- */
  const HIGH_KEYWORDS = ['accident','open manhole','children','school','hospital','fire','collapse','electrocut','live wire','injur','death','flood','sewage overflow','ambulance','fire exit','emergency'];
  const MED_KEYWORDS = ['main road','highway','junction','crowded','market','overflowing','stray'];

  function heuristicClassify(category, description){
    const text = (description||'').toLowerCase();
    let severity = 'Low';
    if (HIGH_KEYWORDS.some(k => text.includes(k))) severity = 'High';
    else if (MED_KEYWORDS.some(k => text.includes(k)) || category === 'pothole') severity = 'Medium';
    const dept = category === 'pothole' ? 'Roads & Infrastructure Dept.'
      : category === 'streetlight' ? 'Electrical Dept.'
      : category === 'garbage' ? 'Sanitation Dept.'
      : category === 'parking' ? 'Traffic Police / Traffic Dept.'
      : 'General Grievance Cell';
    return {
      severity,
      department: dept,
      note: 'Classified locally using keyword analysis (offline mode).'
    };
  }

  async function aiClassify(category, description){
    try{
      const prompt = `You are an AI triage assistant for a municipal corporation civic-issue platform.
Category: ${catInfo(category).label}
Citizen's description: "${description}"

Respond with ONLY a JSON object, no markdown, no preamble, in this exact shape:
{"severity":"High|Medium|Low","department":"<name of the NMC department that should handle this>","note":"<one short sentence, under 20 words, explaining the triage reasoning to a municipal officer>"}`;

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }]
        })
      });
      const data = await response.json();
      const textBlock = (data.content || []).find(b => b.type === 'text');
      if (!textBlock) throw new Error('no text block');
      const clean = textBlock.text.replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(clean);
      if (!parsed.severity || !parsed.department) throw new Error('bad shape');
      return { severity: parsed.severity, department: parsed.department, note: parsed.note || 'Classified by AI triage model.' };
    }catch(e){
      return heuristicClassify(category, description);
    }
  }

  /* ---------------- Render root ---------------- */
  function render(){
    const app = document.getElementById('app');
    app.innerHTML = '';
    app.appendChild(renderHeader());
    const main = document.createElement('main');
    main.appendChild(renderView());
    app.appendChild(main);
    app.appendChild(renderFooter());
    bindGlobalNav(app);
  }

  function renderFooter(){
    return el(`<footer>Smart Awaaz — a public civic issue platform · identity verification demo · data resets on refresh</footer>`);
  }

  function renderHeader(){
    const u = state.currentUser;
    const wrap = el(`<div></div>`);
    wrap.appendChild(el(`
      <header class="topbar">
        <div class="brand" data-nav="landing" style="cursor:pointer">
          <div class="brand-mark">SA</div>
          <div class="brand-text">
            <div class="name">Smart Awaaz</div>
            <div class="tag">NMC Civic Issue Platform</div>
          </div>
        </div>
        <div class="topbar-right">
          ${u ? `<span class="who">${u.type === 'nmc' ? 'Officer' : 'Citizen'}: <b>${escapeHtml(u.name)}</b></span>
                 <button class="btn-ghost-top" data-nav="logout">Log out (बाहेर पडा)</button>`
              : `<span class="who mono" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;">Reporting civic issues, publicly and transparently</span>`}
        </div>
        <img class="header-photo" src="${MODI_PHOTO}" alt="Shri Narendra Modi">
      </header>
    `));
    wrap.appendChild(el(`<div class="orange-divider"></div>`));
    return wrap;
  }

  function bindGlobalNav(root){
    root.querySelectorAll('[data-nav]').forEach(node=>{
      node.addEventListener('click', (e)=>{
        const target = e.currentTarget.getAttribute('data-nav');
        if (target === 'logout'){ state.currentUser = null; state.citizenVerification = null; state.view = 'verificationChoice'; }
        else { state.view = target; }
        render();
      });
    });
  }

  /* ---------------- Views ---------------- */
  function renderView(){
    switch(state.view){
      case 'verificationChoice': return viewVerificationChoice();
      case 'digilocker': return viewDigiLocker();
      case 'manualRegister': return viewManualRegister();
      case 'landing': return viewLanding();
      case 'citizenLogin': return viewCitizenLogin();
      case 'nmcLogin': return viewNmcLogin();
      case 'citizenDashboard': return viewCitizenDashboard();
      case 'reportForm': return viewReportForm();
      case 'nmcDashboard': return viewNmcDashboard();
      case 'nmcHeatmap': return viewNmcHeatmap();
      default: return viewLanding();
    }
  }


  /* ---------------- Citizen identity verification gate ---------------- */
  function viewVerificationChoice(){
    const wrap = el(`
      <div class="verification-wrap">
        <div class="verification-hero">
          <div class="eyebrow">Identity verification · नागरिक पडताळणी</div>
          <h1>Before you raise a civic issue, verify who you are. (तक्रार नोंदवण्यापूर्वी तुमची ओळख पडताळा)</h1>
          <p class="lede">Smart Awaaz uses identity verification to reduce fake reports and help ensure that civic complaints come from genuine Indian citizens.</p>
          <div class="verification-trust">
            <span>🇮🇳 Indian citizen verification</span>
            <span>🔐 Identity-first access</span>
            <span>🛡️ Privacy-conscious demo flow</span>
          </div>
        </div>

        <div class="verification-grid">
          <div class="verify-card recommended">
            <div class="verify-icon">🔐</div>
            <div class="verify-badge">RECOMMENDED</div>
            <h2>Connect DigiLocker (डिजीलॉकर जोडा)</h2>
            <p>Use DigiLocker to verify your identity through an authorised government flow instead of manually typing identity details.</p>
            <ul>
              <li>Government-backed identity source</li>
              <li>Less manual data entry</li>
              <li>Verification result passed to Smart Awaaz</li>
            </ul>
            <button class="btn btn-primary btn-block" data-nav="digilocker">Connect DigiLocker (डिजीलॉकर जोडा)</button>
          </div>

          <div class="verify-card">
            <div class="verify-icon">🪪</div>

  function calculateAge(dob){
    if (!dob) return '';
    const birth = new Date(dob + 'T00:00:00');
    if (Number.isNaN(birth.getTime())) return '';
    const today = new Date();
    let age = today.getFullYear() - birth.getFullYear();
    const m = today.getMonth() - birth.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
    return age;
  }

      toggleFieldError(wrap, 'f-location', location.length < 3); if (location.length < 3) valid = false;
      toggleFieldError(wrap, 'f-desc', description.length < 10); if (description.length < 10) valid = false;
      if (!valid) return;

      const aiPanel = wrap.querySelector('#aiPanel');
      aiPanel.innerHTML = `
        <div class="ai-box">
          <div class="ai-title"><span class="pulse"></span> AI triage assessing this report…</div>
        </div>`;
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Assessing severity…';

      const ai = await aiClassify(c.id, description);

      const issue = {
        id: nextTicket(),
        category: c.id,
        area,
        location,
        description,
        photo: photoData,
        severity: ai.severity,
        department: ai.department,
        aiNote: ai.note,
        status: 'Pending',
        reporterName: state.currentUser.name,
        reporterPhone: state.currentUser.phone,
        reporterEmail: state.currentUser.email,
        createdAt: new Date()
      };
      state.issues.push(issue);

      aiPanel.innerHTML = `
        <div class="ai-box">
          <div class="ai-title">✓ AI triage complete</div>
          <div class="ai-result">
            ${severityBadge(ai.severity)}<br>
            Routed to <b>${escapeHtml(ai.department)}</b>.<br>
            <span style="color:var(--ink-soft);">${escapeHtml(ai.note)}</span>
          </div>
        </div>`;
      submitBtn.textContent = `Filed as ${issue.id} — back to dashboard`;
      submitBtn.disabled = false;
      showToast(`Docket ${issue.id} filed — routed to ${ai.department}`);
      submitBtn.onclick = (ev)=>{ ev.preventDefault(); state.view='citizenDashboard'; render(); };
    });

    wrap.appendChild(form);
    return wrap;
  }

  function viewNmcDashboard(){
    const wrap = el(`<div class="dash-wrap"></div>`);
    wrap.appendChild(el(`
      <div class="dash-head">
        <div>
          <h1>Corporation Dashboard</h1>
          <div class="sub">Officer ${escapeHtml(state.currentUser.name)} · ${escapeHtml(state.currentUser.officerId)}</div>
        </div>
        <button type="button" class="btn btn-outline" data-nav="nmcHeatmap">🗺️ Generate heatmap &amp; priority chart</button>
      </div>
    `));

    const total = state.issues.length;
    const pending = state.issues.filter(i=>i.status==='Pending').length;
    const progress = state.issues.filter(i=>i.status==='In Progress').length;
    const resolved = state.issues.filter(i=>i.status==='Resolved').length;
    const statRow = el(`
      <div class="stat-row">
        <div class="stat"><div class="n" data-count="${total}">0</div><div class="l">Total dockets</div></div>
        <div class="stat"><div class="n" data-count="${pending}">0</div><div class="l">Pending</div></div>
        <div class="stat"><div class="n" data-count="${progress}">0</div><div class="l">In progress</div></div>
        <div class="stat"><div class="n" data-count="${resolved}">0</div><div class="l">Resolved</div></div>
      </div>
    `);
    wrap.appendChild(statRow);
    setTimeout(()=>{
      statRow.querySelectorAll('.n[data-count]').forEach(n=> animateCount(n, Number(n.dataset.count)));
    }, 50);

    const filterRow = el(`<div class="filter-row"></div>`);
    const statusOptions = ['all','Pending','In Progress','Resolved'];
    statusOptions.forEach(s=>{
      const chip = el(`<button type="button" class="chip${state.filter.status===s?' active':''}">${s==='all'?'All statuses':s}</button>`);
      chip.addEventListener('click', ()=>{ state.filter.status = s; render(); });
      filterRow.appendChild(chip);
    });
    wrap.appendChild(filterRow);

    const catFilterRow = el(`<div class="filter-row"></div>`);
    const catChip = el(`<button type="button" class="chip${state.filter.category==='all'?' active':''}">All categories</button>`);
    catChip.addEventListener('click', ()=>{ state.filter.category='all'; render(); });
    catFilterRow.appendChild(catChip);
    CATEGORIES.forEach(c=>{
      const chip = el(`<button type="button" class="chip${state.filter.category===c.id?' active':''}">${c.icon} ${c.label}</button>`);
      chip.addEventListener('click', ()=>{ state.filter.category=c.id; render(); });
      catFilterRow.appendChild(chip);
    });
    wrap.appendChild(catFilterRow);

    const searchRow = el(`
      <div class="search-row">
        <input type="text" placeholder="🔍 Search by location, description or docket ID…" value="${escapeHtml(state.filter.query||'')}">
      </div>
    `);
    searchRow.querySelector('input').addEventListener('input', (e)=>{
      state.filter.query = e.target.value;
      renderNmcList();
    });
    wrap.appendChild(searchRow);

    wrap.appendChild(el(`<div class="section-label">All reported dockets</div>`));

    const listHost = el(`<div id="nmcListHost"></div>`);
    wrap.appendChild(listHost);

    function renderNmcList(){
      listHost.innerHTML = '';
      let list = state.issues.slice().sort((a,b)=>b.createdAt-a.createdAt);
      if (state.filter.status !== 'all') list = list.filter(i=>i.status===state.filter.status);
      if (state.filter.category !== 'all') list = list.filter(i=>i.category===state.filter.category);
      const q = (state.filter.query||'').trim().toLowerCase();
      if (q) list = list.filter(i =>
        i.id.toLowerCase().includes(q) ||
        i.location.toLowerCase().includes(q) ||
        i.description.toLowerCase().includes(q)
      );

      if (list.length === 0){
        listHost.appendChild(el(`<div class="empty">No dockets match this filter yet.</div>`));
        return;
      }
      list.forEach(issue=>{
        const docket = renderDocket(issue, true, true);
        const controls = el(`
          <div style="margin-top:12px; display:flex; align-items:center; gap:10px;">
            <label class="mono" style="font-size:11px; color:var(--ink-soft);">UPDATE STATUS</label>
            <select class="status-select"></select>
          </div>
        `);
        const select = controls.querySelector('select');
        ['Pending','In Progress','Resolved'].forEach(s=>{
          const opt = document.createElement('option');
          opt.value = s; opt.textContent = s;
          if (issue.status === s) opt.selected = true;
          select.appendChild(opt);
        });
        select.addEventListener('change', ()=>{
          issue.status = select.value;
          showToast(`${issue.id} marked as "${select.value}"`);
          render();
        });
        docket.appendChild(controls);
        listHost.appendChild(docket);
      });
    }
    renderNmcList();

    return wrap;
  }

  /* ---------------- Heatmap + area priority ---------------- */
  function computeAreaStats(issuesFiltered){
    const stats = {};
    AREAS.forEach(a=>{ stats[a.id] = { area:a, total:0, high:0, medium:0, low:0, score:0 }; });
    issuesFiltered.forEach(issue=>{
      if (!issue.area || !stats[issue.area]) return;
      const s = stats[issue.area];
      s.total += 1;
      const sev = issue.severity || 'Low';
      if (sev === 'High'){ s.high += 1; s.score += 3; }
      else if (sev === 'Medium'){ s.medium += 1; s.score += 2; }
      else { s.low += 1; s.score += 1; }
    });
    return stats;
  }

  function viewNmcHeatmap(){
    const wrap = el(`<div class="heatmap-wrap"></div>`);
    wrap.appendChild(el(`<a class="back-link" data-nav="nmcDashboard">← Back to dashboard</a>`));
    wrap.appendChild(el(`
      <div class="dash-head">
        <div>
          <h1>Issue Heatmap &amp; Area Priority</h1>
          <div class="sub">Density of reported issues by area, with a ranked list for crew dispatch.</div>
        </div>
      </div>
    `));

    const toolbar = el(`<div class="heatmap-toolbar"></div>`);
    const catOptions = [{ id:'all', label:'All categories', icon:'🗂️' }]
      .concat(CATEGORIES.map(c=>({ id:c.id, label:c.label, icon:c.icon })));
    const activeCat = state.heatmapCategory || 'pothole';
    catOptions.forEach(opt=>{
      const chip = el(`<button type="button" class="chip${activeCat===opt.id?' active':''}">${opt.icon} ${opt.label}</button>`);
      chip.addEventListener('click', ()=>{ state.heatmapCategory = opt.id; render(); });
      toolbar.appendChild(chip);
    });
    wrap.appendChild(toolbar);

    const filtered = state.issues.filter(i => activeCat === 'all' ? true : i.category === activeCat);
    const stats = computeAreaStats(filtered);
    const maxScore = Math.max(1, ...Object.values(stats).map(s=>s.score));

    const stage = el(`<div class="heatmap-stage"></div>`);
    if (filtered.length === 0){
      stage.appendChild(el(`
        <div class="empty" style="position:absolute; inset:16px; display:flex; align-items:center; justify-content:center;">
          No reports yet for this category — the heatmap will populate as citizens file dockets with an area selected.
        </div>
      `));
    } else {
      let svg = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">`;
      AREAS.forEach(a=>{
        const s = stats[a.id];
        const intensity = s.score / maxScore;
        const radius = 3 + intensity * 9;
        const glowRadius = radius + 6;
        const color = intensity > 0.66 ? '#C0392B' : intensity > 0.33 ? '#FF7A1A' : intensity > 0 ? '#E9B94A' : '#CBD8E3';
        const opacity = s.score > 0 ? 0.9 : 0.35;
        svg += `
          <circle cx="${a.x}" cy="${a.y}" r="${glowRadius}" fill="${color}" opacity="${(opacity*0.22).toFixed(2)}"></circle>
          <circle cx="${a.x}" cy="${a.y}" r="${radius}" fill="${color}" opacity="${opacity.toFixed(2)}"></circle>
          <text x="${a.x}" y="${a.y + radius + 5}" font-size="3.1" text-anchor="middle" fill="#5C6B80" font-family="IBM Plex Sans, sans-serif">${escapeHtml(a.label)}</text>
          ${s.total ? `<text x="${a.x}" y="${a.y + 1.2}" font-size="3.4" text-anchor="middle" fill="#fff" font-weight="700" font-family="IBM Plex Mono, monospace">${s.total}</text>` : ''}
        `;
      });
      svg += `</svg>`;
      stage.appendChild(el(`<div style="width:100%;height:100%;">${svg}</div>`));
    }
    wrap.appendChild(stage);

    wrap.appendChild(el(`
      <div class="heatmap-legend">
        <span class="sw"><i style="background:#CBD8E3;"></i> No reports</span>
        <span class="sw"><i style="background:#E9B94A;"></i> Low density</span>
        <span class="sw"><i style="background:#FF7A1A;"></i> Medium density</span>
        <span class="sw"><i style="background:#C0392B;"></i> High density</span>
      </div>
    `));
    wrap.appendChild(el(`
      <div class="heatmap-note">Circle size/colour reflect a severity-weighted score (High×3, Medium×2, Low×1). Positions are illustrative Nagpur localities, not GPS-accurate — meant to guide dispatch by ward.</div>
    `));

    wrap.appendChild(el(`<div class="section-label">Area priority ranking</div>`));

    const priorityList = el(`<div class="priority-list"></div>`);
    const ranked = AREAS.map(a=>stats[a.id]).filter(s=>s.total>0).sort((a,b)=>b.score-a.score);
    if (ranked.length === 0){
      priorityList.appendChild(el(`<div class="empty">No prioritised areas yet — dockets need an area selected at filing time.</div>`));
    } else {
      ranked.forEach((s, idx)=>{
        const pct = Math.max(6, Math.round((s.score / maxScore) * 100));
        const row = el(`
          <div class="priority-row">
            <div class="priority-rank">#${idx+1}</div>
            <div class="priority-bar-wrap">
              <div class="priority-area-name">${escapeHtml(s.area.label)}</div>
              <div class="priority-bar-track"><div class="priority-bar-fill" style="width:${pct}%;"></div></div>
            </div>
            <div class="priority-counts">${s.total} report${s.total===1?'':'s'} · H${s.high}/M${s.medium}/L${s.low}</div>
            <div class="priority-score">${s.score}</div>
          </div>
        `);
        priorityList.appendChild(row);
      });
    }
    wrap.appendChild(priorityList);

    return wrap;
  }

  /* ---------------- Demo seed data (only if nothing has been reported yet) ---------------- */
  function generateDemoPhotoDataUri(seed){
    // Small illustrative placeholder "road with pothole" graphic (not a real photo),
    // so the officer can try click-to-enlarge + on-photo heatmap without uploading one.
    const rand = seededRandom(seed);
    const w = 480, h = 320;
    const cx = w * (0.35 + rand() * 0.3);
    const cy = h * (0.4 + rand() * 0.25);
    const rx = 60 + rand() * 40;
    const ry = 34 + rand() * 22;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <rect width="${w}" height="${h}" fill="#6b6f73"/>
      <rect y="${(h*0.62).toFixed(1)}" width="${w}" height="${(h*0.06).toFixed(1)}" fill="#e8d9a0" opacity="0.85"/>
      <ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="#232323"/>
      <ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${(rx*0.6).toFixed(1)}" ry="${(ry*0.55).toFixed(1)}" fill="#141414"/>
      <path d="M ${(cx-rx*1.3).toFixed(1)} ${cy.toFixed(1)} Q ${(cx-rx*0.6).toFixed(1)} ${(cy-ry*1.4).toFixed(1)} ${(cx+rx*0.2).toFixed(1)} ${(cy-ry*0.3).toFixed(1)}" stroke="#3a3a3a" stroke-width="3" fill="none"/>
      <path d="M ${(cx+rx*0.4).toFixed(1)} ${(cy+ry*0.6).toFixed(1)} Q ${(cx+rx*1.1).toFixed(1)} ${(cy+ry*0.2).toFixed(1)} ${(cx+rx*1.5).toFixed(1)} ${(cy-ry*0.5).toFixed(1)}" stroke="#3a3a3a" stroke-width="3" fill="none"/>
      <text x="12" y="${h-12}" font-family="monospace" font-size="12" fill="#cfd3d6">Illustrative placeholder photo</text>
    </svg>`;
    return 'data:image/svg+xml;base64,' + btoa(svg);
  }

  function seedDemoIssuesIfEmpty(){
    if (state.issues.length) return;
    const demo = [
      { area:'sitabuldi',   location:'Near Sitabuldi Main Road bus stop', desc:'Large pothole right at the crossing, cars swerving into oncoming traffic.', sev:'High', photo:true },
      { area:'sitabuldi',   location:'Sitabuldi market lane',              desc:'Cluster of small potholes near the market entrance.', sev:'Medium', photo:true },
      { area:'dharampeth',  location:'Dharampeth main road near college',  desc:'Pothole has grown after recent rains, water collects in it.', sev:'Medium', photo:true },
      { area:'mahal',       location:'Mahal chowk junction',               desc:'Deep pothole at a crowded junction, near school route.', sev:'High', photo:true },
      { area:'mahal',       location:'Mahal by-lane',                      desc:'Old pothole, slow-growing, minor bump.', sev:'Low', photo:true },
      { area:'civillines',  location:'Civil Lines main avenue',            desc:'Minor surface crack, not yet a full pothole.', sev:'Low', photo:true },
      { area:'ambazari',    location:'Ambazari Lake road',                 desc:'Pothole near the lake gate, affects two-wheelers badly.', sev:'Medium', photo:true },
      { area:'nandanvan',   location:'Nandanvan main road',                desc:'Pothole appeared after drainage work, unmarked at night.', sev:'High', photo:true },
    ];
    demo.forEach(d=>{
      const id = nextTicket();
      state.issues.push({
        id,
        category: 'pothole',
        area: d.area,
        location: d.location,
        description: d.desc,
        photo: d.photo ? generateDemoPhotoDataUri(id + d.location) : null,
        severity: d.sev,
        department: 'Roads & Infrastructure Dept.',
        aiNote: 'Seeded demo docket for heatmap preview.',
        status: 'Pending',
        reporterName: 'Demo Citizen',
        reporterPhone: '',
        reporterEmail: '',
        createdAt: new Date()
      });
    });
  }
  seedDemoIssuesIfEmpty();

  render();
})();
</script>
